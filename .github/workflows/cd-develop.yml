name: "CD - Deploy Develop"

on:
  push:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────
  # 1. Seguridad — se invoca el workflow de escaneo
  # ──────────────────────────────────────────────────────
  security-scan:
    name: "Ejecutar Security Scan"
    uses: ./.github/workflows/security-scan.yml

  # ──────────────────────────────────────────────────────
  # 2. Despliegue API (NestJS + PM2)
  # ──────────────────────────────────────────────────────
  deploy-api:
    name: "Desplegar API Backend"
    needs: security-scan
    uses: ./.github/workflows/deploy-api.yml

  # ──────────────────────────────────────────────────────
  # 3. Despliegue Frontend (Angular + nginx)
  # ──────────────────────────────────────────────────────
  deploy-frontend:
    name: "Desplegar Frontend Angular"
    needs: deploy-api
    uses: ./.github/workflows/deploy-frontend.yml
