name: "CD Develop - Pipeline (Backend)"

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  # Permite lanzar el despliegue a mano desde la pestaña Actions
  workflow_dispatch:

# Evita dos despliegues simultáneos sobre el mismo servidor (rsync + migraciones).
# Los despliegues se encolan en lugar de pisarse.
concurrency:
  group: cd-develop-backend
  cancel-in-progress: false

jobs:
  # 1. Mandar a llamar al flujo de seguridad
  ejecutar-seguridad:
    name: "Validaciones de Seguridad"
    uses: ./.github/workflows/security-scan.yml

  # 2. Instalar y configurar ClamAV en el servidor de destino
  configurar-clamav:
    name: "Configuración de Antivirus"
    needs: ejecutar-seguridad
    uses: ./.github/workflows/setup-clamav.yml

  # 3. Si el escaneo es exitoso y la configuración de ClamAV es correcta, procede con el despliegue del API
  desplegar-backend:
    name: "Despliegue de Backend"
    needs: ejecutar-seguridad
    uses: ./.github/workflows/deploy-api.yml
